<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Login.css">
    <title>Login</title>
</head>
<body>
     <main class="login-container">
        <div class="login-card">

            <div class="logo">
                <span>🔐</span>
            </div>

            <h1>Bem-vindo!</h1>
            <p class="sutitulo">Faça login para acessar sua conta</p>

            <form id="formLogin">

                <div class="campo">
                    <span class="icone">👤</span>

                    <input type="text" id="usuario" placeholder="Nome de usuário" autocomplete="username" required>
                </div>

                <div class="campo">
                    <span class="icone">🔒</span>

                    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>

                    <button type="button" class="mostrar-senha" id="mostarSenha" aria-label="mostar senha">👁</button>
                </div>

                <div class="opcoes">

                    <label class="lembrar">
                        <input type="checkbox" id="lembrar">
                        <span>Lembrar-me</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    Entrar
                </button>

                <p id="mensagem" role="status" aria-live="polite"></p>
            </form>

            <div class="divisor">
                <span>ou</span>
            </div>

            <button type="button" class="btn-alternativo" id="btnGoogle">
                Entrar com Google
            </button>

            <p class="cadastro">
                Não tem uma conta?
                <a href="#">Cadastre-se</a>
            </p>
        </div>
     </main>

     <script src="JS/login.js"></script>
</body>
</html>
